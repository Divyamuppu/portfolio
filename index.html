<body>
<div class="page">
  <header class="top">
    <div class="avatar avatar-sm" data-slot="initials"></div>
    <div class="top-text">
      <span class="top-name" data-slot="name"></span>
      <span class="top-sub" data-slot="subline"></span>
    </div>
    <a class="cta" data-slot="cta" hidden>Get in touch</a>
  </header>

  <div class="layout">
    <aside class="card">
      <div class="cover"><img data-slot="cover" alt="" hidden></div>
      <div class="card-body">
        <div class="avatar avatar-lg" data-slot="initials"></div>
        <div class="who">
          <h1 data-slot="name"></h1>
          <span class="headline" data-slot="headline"></span>
        </div>
        <div class="row" data-slot="location-row" hidden>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <span data-slot="location"></span>
        </div>
        <div class="contacts" data-slot="contacts"></div>
        <div class="stats">
          <div><span class="stat-n" data-slot="project-count">–</span><span class="stat-l">Projects</span></div>
          <div><span class="stat-n" data-slot="client-count">–</span><span class="stat-l">Clients</span></div>
        </div>
      </div>
    </aside>

    <main class="work">
      <div class="chips" role="toolbar" aria-label="Filter by client" data-slot="chips"></div>
      <div class="empty" data-slot="empty" hidden>
        <span class="empty-title">No films yet</span>
        <span class="empty-sub">Check back soon.</span>
      </div>
      <div class="grid" data-slot="grid" aria-live="polite"></div>
    </main>
  </div>
</div>
<noscript><p class="noscript">Turn on JavaScript to see the portfolio, or visit <a href="https://www.youtube.com/@a-tomContentStudio">our YouTube channel</a>.</p></noscript>
